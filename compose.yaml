# Local development + test database only (same engine as production: MySQL 8.4).
# Never use these credentials anywhere else.
#   docker compose up -d
#   NUXT_DATABASE_URL=mysql://artsergi:artsergi@127.0.0.1:3306/artsergi
#   TEST_MYSQL_URL=mysql://root:artsergi@127.0.0.1:3306   (integration tests)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: artsergi
      MYSQL_DATABASE: artsergi
      MYSQL_USER: artsergi
      MYSQL_PASSWORD: artsergi
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-partsergi']
      interval: 5s
      retries: 20
volumes:
  mysqldata:

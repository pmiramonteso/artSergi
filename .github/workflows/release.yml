name: Release

# Manual only. Builds a verified release artifact; deploying it to production
# is a separate job that requires the protected `production` environment
# (configure required reviewers in GitHub → Settings → Environments).
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production after building (requires approval)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Full verification (lint, format, types, tests, build)
        run: npm run check
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Package release
        run: |
          mkdir -p release
          cp -r .output server.cjs package.json .nvmrc release/
          mkdir -p release/tmp
          tar -czf release-${{ github.sha }}.tar.gz -C release .
          sha256sum release-${{ github.sha }}.tar.gz > release-${{ github.sha }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            release-${{ github.sha }}.tar.gz
            release-${{ github.sha }}.tar.gz.sha256
          retention-days: 90

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
      - run: sha256sum -c release-${{ github.sha }}.tar.gz.sha256
      - name: Configure SSH (host key pinned)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and switch release (atomic symlink; previous kept for rollback)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BASE: ${{ secrets.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes $USER@$HOST"
          $SSH "mkdir -p '$BASE/releases/$SHA'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes release-$SHA.tar.gz "$USER@$HOST:$BASE/releases/$SHA/"
          $SSH "cd '$BASE/releases/$SHA' && tar -xzf release-$SHA.tar.gz && rm release-$SHA.tar.gz \
            && ln -sfn '$BASE/releases/$SHA' '$BASE/current.tmp' && mv -T '$BASE/current.tmp' '$BASE/current' \
            && mkdir -p '$BASE/current/tmp' && touch '$BASE/current/tmp/restart.txt'"
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$SITE_URL/api/health/ready"; then exit 0; fi
            sleep 5
          done
          echo "Readiness check failed — roll back (see OPERATIONS.md)" >&2
          exit 1
